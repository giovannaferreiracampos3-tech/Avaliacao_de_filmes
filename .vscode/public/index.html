<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTech - Avaliações</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CineTech</h1>
        <div class="search-bar">
            <input type="text" id="inputFilme"
                   placeholder="Digite o nome do filme (em inglês)...">
            <button id="btnBuscar">Buscar</button>
        </div>
    </header>
 
    <main>
        <!-- O JavaScript vai injetar o cartão do filme aqui dentro -->
        <section id="movie-container">
            <p>Faça uma busca para ver os resultados.</p>
        </section>
 
        <h2>Filmes que já avaliei</h2>
        <section id="lista-avaliacoes"></section>
    </main>
 
    <script src="script.js"></script>
</body>
</html>
